[project]
name = "sba-launcher"
version = "0.1.0"
description = "Zentrale GUI für die drei SBA-Werkzeuge (ausleihe-ausgabe, Bestand-Excel, Barcode-Scanner)"
requires-python = ">=3.12"
dependencies = [
    # QR-View für den Barcode-Tab (gleicher Ansatz wie ausleihe-ausgabe).
    "qrcode[pil]>=8.0",
    # Katalog-Editor (Phase 4): Excel-IO + ISBN-Maskierung. Beide auch im
    # Bestand-Extra des Schwesterprojekts — hier als Launcher-Dep, damit
    # ``core/catalog`` auf dem headless VPS via pytest testbar ist.
    "openpyxl>=3.1",
    "isbnlib>=3.7",
    # tkinter ist stdlib und wird NICHT als dep gelistet (System-Python/Tk-Bundles
    # auf Windows; auf dem headless VPS fehlt Tk bewusst — core/ bleibt tk-frei).
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "TID"]
ignore = [
    # SIM108: ternary `x if cond else y` statt if/else-Block — oft unleserlicher
    # bei längeren Ausdrücken (z. B. splitlines-if-is_file). Lesbarkeit schlägt.
    "SIM108",
]
# gui/ darf tkinter nutzen (nicht auf dem headless VPS testbar); core/ bleibt tk-frei.

# TID251 (banned-api) erzwingt das oben beschriebene core/-bleibt-tk-frei-Prinzip
# maschinell statt nur per Doku: ``import tkinter`` ist repo-weit verboten außer
# in gui/ (per-file-ignores unten hebt die Regel dort auf).
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"tkinter".msg = "core/ bleibt tk-frei (headless-VPS-Testbarkeit) — tkinter gehört in gui/."

[tool.ruff.lint.per-file-ignores]
"gui/*" = ["TID251"]
# Smoke-Test konstruiert echte Tk-Widgets (root/Toplevel) — braucht tkinter direkt.
"tests/test_gui_smoke.py" = ["TID251"]